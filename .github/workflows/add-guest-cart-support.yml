name: Add guest cart support

on:
  push:
    paths:
      - '.github/workflows/add-guest-cart-support.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript
        run: |
          python .github/scripts/patch_guest_cart.py
          node --check cart-selection-for-steam.user.js
          grep -q '@version      1.1.3' cart-selection-for-steam.user.js
          grep -q "readCookie('shoppingCartGID')" cart-selection-for-steam.user.js
          grep -q 'async function getGuestCart()' cart-selection-for-steam.user.js
          grep -q 'const guestMode = !state.config.token;' cart-selection-for-steam.user.js
      - name: Commit v1.1.3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cart-selection-for-steam.user.js README.md CHANGELOG.md
          git commit -m 'fix: support logged-out Steam guest carts'
          git push
