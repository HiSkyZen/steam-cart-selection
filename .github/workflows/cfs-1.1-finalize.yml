name: Finalize Cart Selection 1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfs-1.1-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 .github/cfs-finalize.py

      - name: Syntax and sanity checks
        shell: bash
        run: |
          node --check cart-selection-for-steam.user.js
          grep -q '// @version      1.1.0' cart-selection-for-steam.user.js
          grep -q 'transaction_id: createTransactionId()' cart-selection-for-steam.user.js
          grep -q 'hasConfirmedCheckoutReceipt' cart-selection-for-steam.user.js
          grep -q 'gidcoupon_applied' cart-selection-for-steam.user.js
          grep -q 'GM_openInTab' cart-selection-for-steam.user.js

      - name: Commit release
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cart-selection-for-steam.user.js README.md CHANGELOG.md
          git commit -m 'feat: harden transactional recovery and auto-restore'
          git push
