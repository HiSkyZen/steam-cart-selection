name: Final Cart Selection hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfs-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/cfs-hardening.py
      - run: node --check cart-selection-for-steam.user.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cart-selection-for-steam.user.js CHANGELOG.md
          git commit -m 'fix: guard recovery revisions and gift restore state'
          git push
