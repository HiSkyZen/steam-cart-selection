name: Normalize fallback defaults

on:
  push:
    paths:
      - '.github/workflows/normalize-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fallback defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cart-selection-for-steam.user.js')
          s = path.read_text(encoding='utf-8')

          replacements = {
              '// @version      1.0.0': '// @version      1.0.1',
              "      country: base.COUNTRY || base.country || 'KR',\n      language: base.LANGUAGE || base.language || 'koreana',": "      country: base.COUNTRY || base.country || null,\n      language: base.LANGUAGE || base.language || 'english',",
              "  async function getAccountCart() {\n    const data = await apiGet('IAccountCartService/GetCart/v1/', state.config.token, {\n      user_country: state.config.country,\n    });": "  function countryField(key) {\n    return state.config.country ? { [key]: state.config.country } : {};\n  }\n\n  async function getAccountCart() {\n    const data = await apiGet('IAccountCartService/GetCart/v1/', state.config.token, {\n      ...countryField('user_country'),\n    });",
              "      countrycode: state.config.country,": "      ...countryField('countrycode'),",
              "      line_item_id: id,\n      user_country: state.config.country,": "      line_item_id: id,\n      ...countryField('user_country'),",
              "      user_country: state.config.country,\n      items: items.map": "      ...countryField('user_country'),\n      items: items.map",
              "          language: state.config.language,\n          country_code: state.config.country,": "          language: state.config.language,\n          ...countryField('country_code'),",
              "            gidshoppingcart: String(gid),\n            store_country_code: state.config.country,": "            gidshoppingcart: String(gid),\n            ...countryField('store_country_code'),",
              "          bundleid: Number(item.bundleid),\n          store_country: state.config.country,": "          bundleid: Number(item.bundleid),\n          ...countryField('store_country'),",
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected source fragment not found:\n{old}')
              s = s.replace(old, new, 1)

          if "country: base.COUNTRY || base.country || 'KR'" in s:
              raise SystemExit('KR country fallback remains in userscript')
          if "language: base.LANGUAGE || base.language || 'koreana'" in s:
              raise SystemExit('Korean language fallback remains in userscript')

          path.write_text(s, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          old = changelog.read_text(encoding='utf-8')
          entry = "## 1.0.1 — 2026-09-15\n\n- Changed the unknown-language fallback from Korean to English.\n- Removed the hard-coded KR country fallback; when Steam does not expose a country, country-specific request fields are omitted instead of forcing a region.\n\n"
          changelog.write_text(entry + old, encoding='utf-8')
          PY

          node --check cart-selection-for-steam.user.js

      - name: Commit release fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cart-selection-for-steam.user.js CHANGELOG.md
          git commit -m 'fix: use English as neutral fallback'
          git push
